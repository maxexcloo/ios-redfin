name: XNU

on:
  push:
    branches: [main]
    paths: [.github/workflows/xnu.yaml, "xnu/patches/**"]
  workflow_dispatch:
    inputs:
      clean:
        description: Ignore the incremental build cache
        type: boolean
        default: false

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  # renovate: datasource=git-refs depName=https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  # macOS 13.5 ships xnu-8796, the iOS 16 kernel.
  MACOS_VERSION: "13.5"
  KERNEL_CONFIG: DEVELOPMENT
  MACHINE_CONFIG: SWEET

permissions:
  contents: read

jobs:
  build:
    # macos-15 (GitHub retired macos-14). Its Xcode 16+ iig emits IORPC.kernelContent,
    # which patch 0082 adds to xnu-8796; the kernel builds and runs from macos-15.
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch Build Script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches
      - name: Install Dependencies
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig
      # Incremental builds: dxb/xnu (patched source), dxb/build/xnu.obj and the fakeroot (mig, ctf tools,
      # libfirehose, headers) come from the last successful run. The new patch set is applied to a pristine
      # copy of the source with build.sh's own patches(); rsync --checksum then copies only files whose
      # content changed, so make recompiles just those. A miss or clean=true is the old full build.
      - name: Restore Incremental Build Cache
        id: cache
        if: ${{ !inputs.clean }}
        uses: actions/cache/restore@v6
        with:
          path: |
            dxb/xnu
            dxb/build/xnu.obj
            dxb/fakeroot
          key: xnu-inc-${{ env.MACOS_VERSION }}-${{ env.KERNEL_CONFIG }}-${{ env.MACHINE_CONFIG }}-${{ github.run_id }}
          restore-keys: xnu-inc-${{ env.MACOS_VERSION }}-${{ env.KERNEL_CONFIG }}-${{ env.MACHINE_CONFIG }}-
      - name: Re-Patch Cached Source
        if: steps.cache.outputs.cache-matched-key != ''
        working-directory: dxb
        run: |
          set -euo pipefail
          P=$RUNNER_TEMP/prep
          rm -rf "$P" && mkdir -p "$P"
          cp -a xnu "$P/xnu"
          (cd "$P/xnu" && git checkout -q -- . && git clean -fdqx)
          ln -s "$PWD/patches" "$P/patches"
          (
            # Variables and callbacks are consumed by the evaluated upstream patches function.
            # shellcheck disable=SC2034,SC2329
            WORK_DIR=$P CODEQL=0 KDKROOT=${KDKROOT:-/nonexistent}
            # shellcheck disable=SC2329
            running() { echo "$*"; }
            # shellcheck disable=SC2329
            warning() { echo "$*"; }
            # shellcheck disable=SC2329
            error() { echo "$*" >&2; }
            eval "$(sed -n '/^patches() {/,/^}/p' build.sh)"
            patches
          ) 2>&1 | tee "$RUNNER_TEMP/patch.log"
          # build.sh's patches() logs a bad patch and carries on (see "Verify every patch
          # applied" below), so a malformed patch still produced a "successful" build.
          rsync -rlc --no-times --delete --exclude .git --itemize-changes "$P/xnu/" xnu/ | grep -v '^\.' | head -50 || true
          # build.sh must not re-run its seds over the tree (they rewrite files and bump mtimes)
          sed -i '' 's/^    patches$/    true # patched by the cache step/' build.sh
          rm -rf build/xnu.obj/kernel.* fakeroot/System/Library/Kernels/kernel.*
      - name: Build
        working-directory: dxb
        env:
          # Keep going after errors so one run reports every compile failure.
          MAKEFLAGS: -k
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee "$RUNNER_TEMP/build.log"
      # Runs on the cached path and the full one, after the source is patched either way.
      # build.sh's patches() only warns, so require "Applying patch" for every xnu/patches/*.patch.
      # (blacktop's own optional patches in dxb/patches are not checked: they may legitimately
      # not apply to this macOS.)
      - name: Verify Every Patch Applied
        working-directory: dxb
        run: |
          set -euo pipefail
          log=$RUNNER_TEMP/patch.log
          # Cold builds apply patches during Build; cached builds use the prep log.
          [ -s "$log" ] || log=$RUNNER_TEMP/build.log
          [ -s "$log" ] || { echo "::error::No patch application log"; exit 1; }
          # A patch that is merely redundant (its files are already there from an earlier
          # patch) is harmless; a corrupt or conflicting one is not, and must never pass.
          # 0160 re-adds the DriverKit headers 0030 and friends already provide.
          redundant='0160-sunfish-iomfb-log-async.patch'
          applied=$(grep -oE "Applying patch: .*/[^/]+\.patch" "$log" | sed 's|.*/||' | sort -u)
          bad=0
          for p in "$GITHUB_WORKSPACE"/xnu/patches/*.patch; do
            b=$(basename "$p")
            grep -Fxq "$b" <<< "$applied" && continue
            case " $redundant " in *" $b "*) echo "redundant (files already present): $b"; continue;; esac
            echo "::error file=xnu/patches/$b::not applied (see 'Skipping patch' in the log)"
            grep -A4 "Skipping patch .*/$b" "$log" | head -5 || true
            bad=$((bad + 1))
          done
          echo "$(printf '%s\n' "$applied" | wc -l | tr -d ' ') patches applied, $bad missing"
          [ "$bad" = 0 ]
      - name: Save Incremental Build Cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: |
            dxb/xnu
            dxb/build/xnu.obj
            dxb/fakeroot
          key: xnu-inc-${{ env.MACOS_VERSION }}-${{ env.KERNEL_CONFIG }}-${{ env.MACHINE_CONFIG }}-${{ github.run_id }}
      - name: Package Build Tree for Local Compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7
      - name: Collect Kernel
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xnu-logs
          path: |
            ${{ runner.temp }}/patch.log
            ${{ runner.temp }}/build.log
          if-no-files-found: ignore
